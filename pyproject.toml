[project]
name = "rti-rag"
version = "0.1.0"
description = "RAG system for querying RTI documents from rti.dopt.gov.in"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "llama-index",
    "llama-index-vector-stores-qdrant",
    "llama-index-llms-openrouter",
    "llama-index-embeddings-huggingface",
    "llama-index-postprocessor-flag-embedding-reranker",
    "qdrant-client",
    "docling[vlm]",
    "streamlit",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "ragas",
    "einops>=0.8.2",
]

[tool.uv]
# Pin torch + torchvision to the CUDA 12.1 index so uv pulls GPU builds
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
