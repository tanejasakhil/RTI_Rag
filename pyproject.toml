[project]
name = "rti-rag"
version = "0.1.0"
description = "RAG system for querying RTI documents from rti.dopt.gov.in"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "llama-index",
    "llama-index-vector-stores-qdrant",
    "llama-index-llms-openai-like",
    "llama-index-embeddings-huggingface",
    "llama-index-postprocessor-flag-embedding-reranker",
    "qdrant-client",
    "pymupdf4llm",
    "langdetect",
    "transformers",
    "sentencepiece",
    "streamlit",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "ragas",
    "einops>=0.8.2",
    "easyocr>=1.7.2",
    "sacremoses>=0.1.1",
    "flagembedding",
    "llama-index-postprocessor-sentence-transformer-rerank",
]

[tool.uv]
# Pin torch + torchvision to the CUDA 12.1 index so uv pulls GPU builds
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
flagembedding = { git = "https://github.com/FlagOpen/FlagEmbedding.git" }
